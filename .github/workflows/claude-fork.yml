name: Claude workflow fork

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: claude-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.repository == 'parlali/dossier'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dossier_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/dossier_test
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prisma generate
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.claude
          platforms: linux/amd64
          push: true
          tags: ghcr.io/parlali/dossier:claude-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/parlali/dossier
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
